<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Rollers 26/27</title>
<meta name="description" content="High Rollers FPL head-to-head league tables, 2026/27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0820; --panel:#260d2f; --panel2:#30123b; --line:#43204f;
  --text:#f6eefa; --muted:#b9a3c4; --accent:#00e0ff; --accent2:#9b5cff;
  --win:#21d07a; --draw:#f3c242; --loss:#ff5577; --gold:#ffd54a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4;
  background-image:radial-gradient(900px 400px at 10% -10%,#3a0f4a 0,transparent 70%),radial-gradient(700px 300px at 110% 0,#0b3550 0,transparent 70%)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 48px}
header{padding:28px 0 14px}
.kicker{font:700 12px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font:900 clamp(34px,8vw,56px)/.95 Archivo,sans-serif;margin:8px 0 6px;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px}
.sub b{color:var(--text);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--muted)}
.dot.live{background:var(--win);box-shadow:0 0 0 3px #21d07a33}
nav{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding:10px 0 12px;margin:0 -16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
  padding:9px 15px;font:600 13px Inter;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#120318;border-color:transparent}
.tab.empty{opacity:.45}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 16px 10px;flex-wrap:wrap}
.card-h h2{font:800 20px Archivo;margin:0}
.card-h .meta{color:var(--muted);font-size:12px}
.leader{display:flex;align-items:center;gap:14px;margin:0 16px 14px;padding:14px;border-radius:12px;
  background:linear-gradient(90deg,#00e0ff22,#9b5cff22);border:1px solid #9b5cff55}
.leader .crown{font-size:26px}
.leader .n{font:800 18px Archivo}
.leader .t{color:var(--muted);font-size:12px}
.leader .p{margin-left:auto;text-align:right;font:900 26px Archivo}
.leader .p small{display:block;font:500 11px Inter;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 11px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:8px 4px;border-bottom:1px solid var(--line)}
td{text-align:center;padding:10px 4px;border-bottom:1px solid #ffffff0d}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.pos{width:34px;font:800 14px Archivo;color:var(--muted)}
tr.top td.pos{color:var(--gold)}
td.mgr .n{font-weight:600}
td.mgr .t{color:var(--muted);font-size:12px}
td.pts{font:900 16px Archivo;color:var(--text)}
tr.me{background:#00e0ff10}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:16px;height:16px;border-radius:4px;font:700 9px/16px Inter;font-style:normal;color:#120318}
.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--loss)}
.hide-sm{}
@media (max-width:560px){.hide-sm{display:none}td,th{padding-left:2px;padding-right:2px}}
.gw{margin-bottom:14px}
.gw h3{font:800 15px Archivo;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.gw h3 span{font:500 12px Inter;color:var(--muted)}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #ffffff0d}
.fx:last-child{border-bottom:0}
.fx .h{text-align:right}.fx .a{text-align:left}
.fx .n{font-weight:600;font-size:14px}
.fx .won{color:var(--text)} .fx .lost{color:var(--muted);font-weight:500}
.score{display:flex;background:#fff;color:#2b0a35;border-radius:7px;font:800 16px Archivo;overflow:hidden}
.score b{padding:5px 9px;min-width:38px;text-align:center}
.score b+b{border-left:1px solid #2b0a3533}
.empty-state{padding:36px 16px;text-align:center;color:var(--muted)}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">FPL Head-to-Head</div>
    <h1>High <span>Rollers</span> 26/27</h1>
    <div class="sub" id="status"><span class="dot"></span>Loading results…</div>
  </header>
  <nav><div class="tabs" id="tabs" role="tablist"></div></nav>
  <main id="view"></main>
  <footer>
    Win 3 · Draw 1 · Loss 0. Ties broken by points scored (PF).
    <div class="legend"><span>P played</span><span>W/D/L</span><span>PF points for</span><span>PA points against</span></div>
  </footer>
</div>
<script>
const SHEET_ID = "1-7-Lr32t4rf2l1T8VxSz1aQlTwJ4Cq9mCoI_GZYwr0s";
const TAB = "📊 Scores Input";
const LIVE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&range=A4:F400&sheet=${encodeURIComponent(TAB)}`;

const TEAMS = {
  "Jeremiah Wright":"AcheampongpingpongFC","Francis Mc Shea":"Youri Wizard Harry","James Bourke":"Roy Makaay Dubai",
  "Ronan Sherman":"The Cuban Priests","Sean Boyle":"Iraolas Out","John Redmond":"Jim & Liz - so it is",
  "James Teague":"Milo'satthewheel","Eden Kane":"Keelombia","Paul Caulfield":"LallanasInPeejamas",
  "Michael Redmond":"WirtzCaseScenario","Chris Grant":"Paris And Yer Man","Richie McAuliffe":"Saigon Setbacks",
  "Francis Redmond":"Azzurri Blues","Rich Blain":"Brooklyn Wanderers"
};
const MANAGERS = Object.keys(TEAMS);
const MONTHS = ["August","September","October","November","December","January","February","March","April","May"];

let results = [];

function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(cell);cell="";}
    else if(c=='\n'){row.push(cell);rows.push(row);row=[];cell="";}
    else if(c!='\r') cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function clean(rows){
  return rows.map(r=>[parseInt(String(r[0]).replace(/\D/g,""),10),String(r[1]).trim(),String(r[2]).trim(),Number(r[3]),Number(r[4]),String(r[5]).trim()])
    .filter(r=>r[0]>0 && TEAMS[r[2]] && TEAMS[r[5]] && String(r[3])!=="" && !isNaN(r[3]) && !isNaN(r[4]) && r[3]+r[4]>0);
}

function table(filter){
  const s={};MANAGERS.forEach(m=>s[m]={m,p:0,w:0,d:0,l:0,pf:0,pa:0,pts:0,form:[]});
  results.filter(filter).sort((a,b)=>a[0]-b[0]).forEach(([gw,,h,hs,as,a])=>{
    const H=s[h],A=s[a];
    H.p++;A.p++;H.pf+=hs;H.pa+=as;A.pf+=as;A.pa+=hs;
    if(hs>as){H.w++;A.l++;H.form.push("W");A.form.push("L");}
    else if(hs<as){A.w++;H.l++;A.form.push("W");H.form.push("L");}
    else{H.d++;A.d++;H.form.push("D");A.form.push("D");}
  });
  const list=Object.values(s);list.forEach(x=>x.pts=x.w*3+x.d);
  return list.sort((a,b)=>b.pts-a.pts||b.pf-a.pf||a.m.localeCompare(b.m));
}

const VIEWS=[
  {id:"overall",label:"Overall",title:"Overall Table",sub:"All gameweeks",f:()=>true},
  {id:"h1",label:"GW1–19",title:"First Half",sub:"Gameweeks 1 to 19",f:r=>r[0]<=19},
  {id:"h2",label:"GW20–38",title:"Second Half",sub:"Gameweeks 20 to 38",f:r=>r[0]>=20},
  ...MONTHS.map(m=>({id:m.toLowerCase(),label:m.slice(0,3),title:m,sub:"Monthly table",f:r=>r[1]===m})),
  {id:"results",label:"Results",title:"Results"}
];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderTable(v){
  const rows=table(v.f);const played=results.filter(v.f);
  if(!played.length) return `<div class="card"><div class="card-h"><h2>${v.title}</h2><span class="meta">${v.sub}</span></div><div class="empty-state">No results yet for this table.</div></div>`;
  const gws=[...new Set(played.map(r=>r[0]))].sort((a,b)=>a-b);
  const span=gws.length>1?`GW${gws[0]}–GW${gws[gws.length-1]}`:`GW${gws[0]}`;
  const L=rows[0];
  return `<div class="card">
    <div class="card-h"><h2>${v.title}</h2><span class="meta">${v.sub} · ${span}</span></div>
    <div class="leader"><span class="crown">👑</span><div><div class="n">${esc(L.m)}</div><div class="t">${esc(TEAMS[L.m])}</div></div>
      <div class="p">${L.pts}<small>pts · ${L.pf} PF</small></div></div>
    <table><thead><tr><th></th><th class="l">Manager</th><th>P</th><th>W</th><th>D</th><th>L</th><th class="hide-sm">PF</th><th class="hide-sm">PA</th><th>Pts</th><th class="hide-sm">Form</th></tr></thead><tbody>
    ${rows.map((x,i)=>`<tr class="${i<3?'top':''}${x.m==='James Teague'?' me':''}">
      <td class="pos">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>
      <td class="l mgr"><div class="n">${esc(x.m)}</div><div class="t">${esc(TEAMS[x.m])}</div></td>
      <td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td>
      <td class="hide-sm">${x.pf}</td><td class="hide-sm">${x.pa}</td>
      <td class="pts">${x.pts}</td>
      <td class="hide-sm"><div class="form">${x.form.slice(-5).map(f=>`<i class="${f}">${f}</i>`).join("")}</div></td></tr>`).join("")}
    </tbody></table></div>`;
}

function renderResults(){
  const gws=[...new Set(results.map(r=>r[0]))].sort((a,b)=>b-a);
  if(!gws.length) return `<div class="card"><div class="empty-state">No results yet.</div></div>`;
  return gws.map(g=>{
    const rs=results.filter(r=>r[0]===g);
    return `<div class="card gw"><h3>Gameweek ${g}<span>${rs[0][1]}</span></h3>
    ${rs.map(([,,h,hs,as,a])=>`<div class="fx">
      <div class="h"><div class="n ${hs>=as?'won':'lost'}">${esc(h)}</div></div>
      <div class="score"><b>${hs}</b><b>${as}</b></div>
      <div class="a"><div class="n ${as>=hs?'won':'lost'}">${esc(a)}</div></div></div>`).join("")}</div>`;
  }).join("");
}

function show(id){
  const v=VIEWS.find(x=>x.id===id)||VIEWS[0];
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.id===v.id));
  document.getElementById("view").innerHTML = v.id==="results"?renderResults():renderTable(v);
  const el=document.querySelector(`.tab[data-id="${v.id}"]`);if(el)el.scrollIntoView({inline:"center",block:"nearest"});
  history.replaceState(null,"","#"+v.id);
}

function buildTabs(){
  document.getElementById("tabs").innerHTML=VIEWS.map(v=>{
    const has=v.f?results.some(v.f):true;
    return `<button class="tab${has?'':' empty'}" role="tab" data-id="${v.id}">${v.label}</button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>show(t.dataset.id));
}

function defaultView(){
  const h=location.hash.slice(1);if(VIEWS.some(v=>v.id===h))return h;
  const last=results.reduce((a,r)=>r[0]>a[0]?r:a,[0,"August"]);
  return last[1].toLowerCase();
}

async function load(){
  const status=document.getElementById("status");
  let live=false;
  try{
    const r=await fetch(LIVE_URL,{cache:"no-store"});
    if(!r.ok) throw 0;
    const rows=clean(parseCSV(await r.text()));
    if(!rows.length) throw 0;
    results=rows;live=true;
  }catch(e){
    try{const d=await (await fetch("data.json",{cache:"no-store"})).json();results=d.results;}catch(_){results=[];}
  }
  const latest=results.reduce((m,r)=>Math.max(m,r[0]),0);
  status.innerHTML=`<span class="dot ${live?'live':''}"></span>${live?'Live from the league sheet':'Saved snapshot'} · results up to <b>GW${latest}</b>`;
  buildTabs();show(defaultView());
}
load();
</script>
</body>
</html>
