<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Rollers 26/27</title>
<meta name="description" content="High Rollers FPL head-to-head league tables, 2026/27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#37003c; --purple2:#2b0030; --cyan:#04f5ff; --green:#00ff87; --pink:#e90052;
  --grad:linear-gradient(90deg,#04f5ff 0%,#5b8cff 55%,#963cff 100%);
  --bg:#f3f1f4; --card:#fff; --line:#e8e3ea; --text:#37003c; --muted:#76667a;
  --win:#00c26e; --draw:#f2b705; --loss:#e90052;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
.top{background:var(--purple);color:#fff;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,#963cff66 0,transparent 65%)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{padding:26px 0 18px;position:relative;z-index:1}
.kicker{display:inline-block;font:800 11px/1 Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);
  background:var(--green);padding:5px 8px;border-radius:4px}
h1{font:900 clamp(32px,8vw,52px)/1 Archivo,sans-serif;margin:12px 0 8px;letter-spacing:-.01em}
.sub{color:#d9c8de;font-size:13px}
.sub b{color:#fff;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:#b9a3c4}
.dot.live{background:var(--green);box-shadow:0 0 0 3px #00ff8740}
nav{position:sticky;top:0;z-index:5;background:var(--purple);border-top:1px solid #ffffff14;box-shadow:0 2px 10px #37003c30}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;scrollbar-width:none;max-width:860px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;color:#e6d9ea;padding:14px 12px 12px;font:700 14px Inter;cursor:pointer;
  white-space:nowrap;border-bottom:4px solid transparent}
.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--green)}
.tab.empty{opacity:.45}
main{padding:18px 0 8px}
.card{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px #37003c1a}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 16px 12px;flex-wrap:wrap}
.card-h h2{font:900 22px Archivo,sans-serif;margin:0}
.card-h .meta{color:var(--muted);font-size:12px;font-weight:600}
.leader{display:flex;align-items:center;gap:14px;margin:0 12px 12px;padding:16px;border-radius:10px;background:var(--grad);color:#fff}
.leader .crown{font-size:24px}
.leader .lbl{font:800 10px Inter;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.leader .n{font:900 19px Archivo}
.leader .t{font-size:12px;opacity:.9}
.leader .p{margin-left:auto;text-align:center;background:#fff;color:var(--purple);border-radius:8px;padding:6px 12px;font:900 24px Archivo,sans-serif;line-height:1}
.leader .p small{display:block;font:700 10px Inter;color:var(--muted);margin-top:3px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{background:var(--purple);color:#fff;font:700 11px Inter;letter-spacing:.04em;text-transform:uppercase;text-align:center;padding:10px 4px}
td{text-align:center;padding:11px 4px;border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:#faf8fb}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.pos{width:36px;font:900 15px Archivo}
td.mgr .n{font-weight:700}
td.mgr .t{color:var(--muted);font-size:12px}
td.pts{font:900 17px Archivo}
tr.me td{background:#00ff8722}
tr.me td.mgr .n::after{content:"YOU";margin-left:6px;font:800 9px Inter;background:var(--purple);color:var(--green);padding:2px 4px;border-radius:3px;vertical-align:2px}
.mv{display:inline-block;width:0;height:0;margin-left:4px}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:17px;height:17px;border-radius:50%;font:800 9px/17px Inter;font-style:normal;color:#fff}
.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--loss)}
@media (max-width:560px){.hide-sm{display:none}td,th{padding-left:2px!important;padding-right:2px!important}}
.gw{margin-bottom:14px}
.gw h3{font:900 16px Archivo,sans-serif;margin:0;padding:12px 16px;background:var(--purple);color:#fff;display:flex;justify-content:space-between}
.gw h3 span{font:600 12px Inter;color:var(--green)}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx .h{text-align:right}.fx .a{text-align:left}
.fx .n{font-weight:700;font-size:14px}
.fx .t{color:var(--muted);font-size:11px}
.fx .lost .n{font-weight:500;color:var(--muted)}
.fx.mine{background:var(--grad);color:#fff}
.fx.mine .t,.fx.mine .lost .n{color:#ffffffcc}
.score{display:flex;background:var(--purple);color:#fff;border-radius:6px;font:900 16px Archivo,sans-serif;overflow:hidden}
.fx.mine .score{background:#fff;color:var(--purple)}
.score b{padding:6px 9px;min-width:38px;text-align:center}
.score b+b{border-left:1px solid #ffffff30}
.fx.mine .score b+b{border-left-color:#37003c30}
.empty-state{padding:36px 16px;text-align:center;color:var(--muted)}
footer{padding:22px 0 40px;color:var(--muted);font-size:12px;text-align:center}
.legend{display:flex;gap:14px;justify-content:center;margin-top:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <header>
    <div class="kicker">Head-to-Head League</div>
    <h1>High Rollers 26/27</h1>
    <div class="sub" id="status"><span class="dot"></span>Loading results…</div>
  </header>
</div></div>
<nav><div class="tabs" id="tabs" role="tablist"></div></nav>
<div class="wrap">
  <main id="view"></main>
  <footer>
    Win 3 · Draw 1 · Loss 0. Ties broken by points scored (PF).
    <div class="legend"><span>P played</span><span>W/D/L</span><span>PF points for</span><span>PA points against</span></div>
  </footer>
</div>
<script>
const SHEET_ID = "1-7-Lr32t4rf2l1T8VxSz1aQlTwJ4Cq9mCoI_GZYwr0s";
const TAB = "📊 Scores Input";
const LIVE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&range=A4:F400&sheet=${encodeURIComponent(TAB)}`;

const TEAMS = {
  "Jeremiah Wright":"AcheampongpingpongFC","Francis Mc Shea":"Youri Wizard Harry","James Bourke":"Roy Makaay Dubai",
  "Ronan Sherman":"The Cuban Priests","Sean Boyle":"Iraolas Out","John Redmond":"Jim & Liz - so it is",
  "James Teague":"Milo'satthewheel","Eden Kane":"Keelombia","Paul Caulfield":"LallanasInPeejamas",
  "Michael Redmond":"WirtzCaseScenario","Chris Grant":"Paris And Yer Man","Richie McAuliffe":"Saigon Setbacks",
  "Francis Redmond":"Azzurri Blues","Rich Blain":"Brooklyn Wanderers"
};
const MANAGERS = Object.keys(TEAMS);
const ME = null; // shared page: no personal highlight
const MONTHS = ["August","September","October","November","December","January","February","March","April","May"];

let results = [];

function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(cell);cell="";}
    else if(c=='\n'){row.push(cell);rows.push(row);row=[];cell="";}
    else if(c!='\r') cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function clean(rows){
  return rows.map(r=>[parseInt(String(r[0]).replace(/\D/g,""),10),String(r[1]).trim(),String(r[2]).trim(),Number(r[3]),Number(r[4]),String(r[5]).trim()])
    .filter(r=>r[0]>0 && TEAMS[r[2]] && TEAMS[r[5]] && String(r[3])!=="" && !isNaN(r[3]) && !isNaN(r[4]) && r[3]+r[4]>0);
}

function table(filter){
  const s={};MANAGERS.forEach(m=>s[m]={m,p:0,w:0,d:0,l:0,pf:0,pa:0,pts:0,form:[]});
  results.filter(filter).sort((a,b)=>a[0]-b[0]).forEach(([gw,,h,hs,as,a])=>{
    const H=s[h],A=s[a];
    H.p++;A.p++;H.pf+=hs;H.pa+=as;A.pf+=as;A.pa+=hs;
    if(hs>as){H.w++;A.l++;H.form.push("W");A.form.push("L");}
    else if(hs<as){A.w++;H.l++;A.form.push("W");H.form.push("L");}
    else{H.d++;A.d++;H.form.push("D");A.form.push("D");}
  });
  const list=Object.values(s);list.forEach(x=>x.pts=x.w*3+x.d);
  return list.sort((a,b)=>b.pts-a.pts||b.pf-a.pf||a.m.localeCompare(b.m));
}

const VIEWS=[
  {id:"overall",label:"Overall",title:"Overall Table",sub:"All gameweeks",f:()=>true},
  {id:"h1",label:"GW1–19",title:"First Half",sub:"Gameweeks 1 to 19",f:r=>r[0]<=19},
  {id:"h2",label:"GW20–38",title:"Second Half",sub:"Gameweeks 20 to 38",f:r=>r[0]>=20},
  ...MONTHS.map(m=>({id:m.toLowerCase(),label:m.slice(0,3),title:m,sub:"Monthly table",f:r=>r[1]===m})),
  {id:"results",label:"Results",title:"Results"}
];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderTable(v){
  const rows=table(v.f);const played=results.filter(v.f);
  if(!played.length) return `<div class="card"><div class="card-h"><h2>${v.title}</h2><span class="meta">${v.sub}</span></div><div class="empty-state">No results yet for this table.</div></div>`;
  const gws=[...new Set(played.map(r=>r[0]))].sort((a,b)=>a-b);
  const span=gws.length>1?`GW${gws[0]}–GW${gws[gws.length-1]}`:`GW${gws[0]}`;
  const L=rows[0];
  return `<div class="card">
    <div class="card-h"><h2>${v.title}</h2><span class="meta">${v.sub} · ${span}</span></div>
    <div class="leader"><span class="crown">👑</span><div><div class="lbl">Leader</div><div class="n">${esc(L.m)}</div><div class="t">${esc(TEAMS[L.m])}</div></div>
      <div class="p">${L.pts}<small>pts · ${L.pf} PF</small></div></div>
    <table><thead><tr><th></th><th class="l">Manager</th><th>P</th><th>W</th><th>D</th><th>L</th><th class="hide-sm">PF</th><th class="hide-sm">PA</th><th>Pts</th><th class="hide-sm">Form</th></tr></thead><tbody>
    ${rows.map((x,i)=>`<tr class="${x.m===ME?'me':''}">
      <td class="pos">${i+1}</td>
      <td class="l mgr"><div class="n">${esc(x.m)}</div><div class="t">${esc(TEAMS[x.m])}</div></td>
      <td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td>
      <td class="hide-sm">${x.pf}</td><td class="hide-sm">${x.pa}</td>
      <td class="pts">${x.pts}</td>
      <td class="hide-sm"><div class="form">${x.form.slice(-5).map(f=>`<i class="${f}">${f}</i>`).join("")}</div></td></tr>`).join("")}
    </tbody></table></div>`;
}

function renderResults(){
  const gws=[...new Set(results.map(r=>r[0]))].sort((a,b)=>b-a);
  if(!gws.length) return `<div class="card"><div class="empty-state">No results yet.</div></div>`;
  return gws.map(g=>{
    const rs=results.filter(r=>r[0]===g);
    return `<div class="card gw"><h3>Gameweek ${g}<span>${rs[0][1]}</span></h3>
    ${rs.map(([,,h,hs,as,a])=>`<div class="fx${h===ME||a===ME?' mine':''}">
      <div class="h ${hs>=as?'':'lost'}"><div class="n">${esc(h)}</div><div class="t">${esc(TEAMS[h])}</div></div>
      <div class="score"><b>${hs}</b><b>${as}</b></div>
      <div class="a ${as>=hs?'':'lost'}"><div class="n">${esc(a)}</div><div class="t">${esc(TEAMS[a])}</div></div></div>`).join("")}</div>`;
  }).join("");
}

function show(id){
  const v=VIEWS.find(x=>x.id===id)||VIEWS[0];
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.id===v.id));
  document.getElementById("view").innerHTML = v.id==="results"?renderResults():renderTable(v);
  const el=document.querySelector(`.tab[data-id="${v.id}"]`);if(el)el.scrollIntoView({inline:"center",block:"nearest"});
  history.replaceState(null,"","#"+v.id);
}

function buildTabs(){
  document.getElementById("tabs").innerHTML=VIEWS.map(v=>{
    const has=v.f?results.some(v.f):true;
    return `<button class="tab${has?'':' empty'}" role="tab" data-id="${v.id}">${v.label}</button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>show(t.dataset.id));
}

function defaultView(){
  const h=location.hash.slice(1);if(VIEWS.some(v=>v.id===h))return h;
  const last=results.reduce((a,r)=>r[0]>a[0]?r:a,[0,"August"]);
  return last[1].toLowerCase();
}

async function load(){
  const status=document.getElementById("status");
  let live=false;
  try{
    const r=await fetch(LIVE_URL,{cache:"no-store"});
    if(!r.ok) throw 0;
    const rows=clean(parseCSV(await r.text()));
    if(!rows.length) throw 0;
    results=rows;live=true;
  }catch(e){
    try{const d=await (await fetch("data.json",{cache:"no-store"})).json();results=d.results;}catch(_){results=[];}
  }
  const latest=results.reduce((m,r)=>Math.max(m,r[0]),0);
  status.innerHTML=`<span class="dot ${live?'live':''}"></span>${live?'Live from the league sheet':'Saved snapshot'} · results up to <b>GW${latest}</b>`;
  buildTabs();show(defaultView());
}
load();
</script>
</body>
</html>
